<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aplikasi Wali Kelas</title>

  <!-- Font & Ikon -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- DataTables (Bootstrap 5 theme) -->
  <link href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css" rel="stylesheet">

  <!-- Design System Aplikasi (dihosting bersama file ini) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="wk-loading-screen">
    <div class="wk-spinner"></div>
    <div style="font-size:.85rem;color:var(--c-text-muted);">Memuat Aplikasi Wali Kelas...</div>
  </div>

  <div id="wk-root"></div>

  <!-- Library Eksternal -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.8/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Logika Aplikasi (satu file, dihosting bersama file ini) -->
  <script src="app.js"></script>

  <script>
    window.addEventListener('load', function(){
      initApp();
    });
  </script>

</body>
</html>
