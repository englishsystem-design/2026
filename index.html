<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#152B47">
  <title>Aplikasi Wali Kelas</title>

  <!-- Tema disetel SEBELUM apa pun dirender supaya tidak ada kedipan warna -->
  <script>
    try{
      if ((localStorage.getItem('wk_theme') || 'light') === 'dark'){
        document.documentElement.setAttribute('data-theme','dark');
      }
    }catch(e){}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">

  <!-- Ikon -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

  <!-- Bootstrap 5 (CSS): dibutuhkan sejak render pertama (grid, form, modal) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Design System Aplikasi -->
  <link rel="stylesheet" href="style.css">

  <!--
    CATATAN PERFORMA
    jQuery, DataTables, Chart.js, dan SweetAlert2 SENGAJA TIDAK dimuat di sini.
    Keempatnya kini diunduh oleh app.js hanya ketika fiturnya benar-benar dipakai
    (lihat pastikanDataTables / pastikanChart / pastikanSwal), sehingga tampilan
    utama aplikasi bisa muncul dan dipakai lebih dulu:
        Fast First Paint -> Interactive Shell -> Feature Dependency On Demand
    Jangan mengembalikan tag <script> library tersebut ke sini.
  -->
</head>
<body>

  <div id="wk-loading-screen">
    <div class="wk-spinner"></div>
    <div style="font-size:.82rem;color:var(--c-text-muted);">Memuat Aplikasi Wali Kelas...</div>
  </div>

  <div id="wk-root"></div>

  <!-- Bootstrap bundle (dropdown & modal dipakai oleh shell aplikasi) -->
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Logika Aplikasi -->
  <script defer src="app.js"></script>

  <script>
    // Kedua script di atas memakai "defer", jadi keduanya sudah selesai dieksekusi
    // saat DOMContentLoaded. Aplikasi tidak lagi menunggu seluruh resource
    // (font, gambar) selesai seperti pada event "load" sebelumnya.
    document.addEventListener('DOMContentLoaded', function(){ initApp(); });
  </script>

</body>
</html>
